name: Weekly Dengue Forecast Pipeline

on:
  schedule:
    # Runs every Monday at 04:00 UTC (aligned with Sri Lanka Epidemiology Unit weekly report publication)
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      as_of_date:
        description: 'Optional forecast origin date override (YYYY-MM-DD or YYYY-Www)'
        required: false
        default: ''

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cache Processed Data and Raw Downloads
        uses: actions/cache@v4
        with:
          path: |
            data/raw/weather/
            data/processed/
          key: ${{ runner.os }}-silentnode-data-${{ hashFiles('data/processed/district_lookup.csv') }}
          restore-keys: |
            ${{ runner.os }}-silentnode-data-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Unit & Leakage Test Suite
        run: |
          python -m unittest discover -s tests -p "test_*.py"

      - name: Ingest Case & Weather Updates (with Staleness Fallback)
        id: ingest
        run: |
          python scripts/ingest_cases.py || echo "Case ingestion flagged, using latest cached data."
          python scripts/ingest_weather.py || echo "Weather API rate-limited, fallback climatology applied."

      - name: Execute Operational Forecast Engine
        run: |
          if [ -n "${{ github.event.inputs.as_of_date }}" ]; then
            python scripts/run_forecast.py --as-of "${{ github.event.inputs.as_of_date }}"
          else
            python scripts/run_forecast.py
          fi

      - name: Upload Forecast Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: silentnode-forecast-outputs
          path: |
            outputs/latest/forecast_table.csv
            outputs/latest/allocation_matrix.csv
            outputs/latest/run_metadata.json
