[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "silentnode"
version = "0.1.0"
description = "4-week district dengue risk forecaster for Sri Lanka"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=0.9.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "scikit-learn>=1.3.0",
    "lightgbm>=4.0.0",
    "geopandas>=0.14.0",
    "requests>=2.31.0",
    "openpyxl>=3.1.0",
    "pdfplumber>=0.10.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
]
